rules:
  - id: "high_pyrite"
    description: "High pyrite content detected"
    condition:
      target: "pyrite"
      operator: ">"
      value: 15
    action:
      priority: "HIGH"
      message: "High pyrite. Increase pH with lime to depress pyrite. Add depressants (sodium humate, CMC). Control grind size."
      icon: "alert-triangle"

  - id: "low_cu_recovery_chalcopyrite"
    description: "Low predicted Cu recovery with chalcopyrite present (indicates poor liberation)"
    condition:
      target: "cu_recovery"
      operator: "<"
      value: 75
    action:
      priority: "HIGH"
      message: "Poor Cu recovery. If chalcopyrite is locked, finer grind required. Consider regrinding and higher collector dosage."
      icon: "hammer"

  - id: "high_clay"
    description: "High clay minerals (Kaolinite/Chlorite) detected"
    condition:
      target: "kaolinite"
      operator: ">"
      value: 10
    action:
      priority: "MEDIUM"
      message: "High clays detected. Add dispersants (sodium silicate). Consider blending and monitor pulp rheology."
      icon: "droplet"

  - id: "high_bwi"
    description: "High Bond Work Index (WI) detected"
    condition:
      target: "bwi"
      operator: ">"
      value: 15
    action:
      priority: "MEDIUM"
      message: "Hard ore detected (High WI). Adjust mill feed rate or grind target."
      icon: "gauge"

  - id: "copper_oxides"
    description: "Copper oxides (Malachite/Chrysocolla) present"
    condition:
      target: "malachite"
      operator: ">"
      value: 2
    action:
      priority: "HIGH"
      message: "Copper oxides present. Standard xanthate ineffective. Perform sulfidation with sodium sulfide before collector."
      icon: "flask-conical"
      
  - id: "low_recovery_low_confidence"
    description: "Low predicted recovery but uncertain"
    condition:
      target: "cu_recovery"
      operator: "<"
      value: 70
      confidence: "<"
      confidence_value: 0.60
    action:
      priority: "MEDIUM"
      message: "Prediction uncertain. Laboratory verification recommended."
      icon: "shield-question"

  - id: "mo_cu_separation"
    description: "Molybdenite and Chalcopyrite both present (Cu-Mo Separation)"
    condition:
      target: "molybdenite"
      operator: ">"
      value: 1
    action:
      priority: "HIGH"
      message: "Molybdenite detected. Initiate Cu-Mo selective separation: Depress chalcopyrite using NaHS or Na2S, and use kerosene collector for MoS2."
      icon: "git-branch"

  - id: "high_silica_iron_ore"
    description: "High Silica Feed in Flotation (Sourced from Kaggle Iron Ore dataset)"
    condition:
      target: "silica"
      operator: ">"
      value: 10
    action:
      priority: "HIGH"
      message: "High Silica impurity detected. Increase Starch Flow (metal depressant) and adjust Amina Flow (silica collector). Monitor Air Flow columns."
      icon: "arrow-up"

  - id: "water_quality_hardness"
    description: "High Water Hardness / Impurities in Flotation Water (Sourced from HZDR Kinetics dataset)"
    condition:
      target: "water_hardness"
      operator: ">"
      value: 150
    action:
      priority: "MEDIUM"
      message: "Poor water quality/high hardness detected. Calcium and Magnesium ions may consume reagents. Increase collector dosage to compensate."
      icon: "droplet"

  - id: "alunite_acidity"
    description: "Alunite presence lowers pH and spikes lime consumption"
    condition:
      target: "alunite"
      operator: ">"
      value: 1
    action:
      priority: "HIGH"
      message: "Alunite detected. Anticipate natural pH drop. Recommend review of lime dosage strategy (potential FloatStar pH Controller integration)."
      icon: "flask-conical"

  - id: "high_k_feldspar_wi"
    description: "Potassium Feldspar causes high Work Index (WI)"
    condition:
      target: "k-feldspar"
      operator: ">"
      value: 10
    action:
      priority: "MEDIUM"
      message: "Hard ore predicted (High K-Feldspar). Recommend metallurgical review of grinding energy requirements (potential MillStar/StarCS RNMPC integration)."
      icon: "gauge"

  - id: "chalcopyrite_locked_pyrite"
    description: "Chalcopyrite enclosed in pyrite requires regrind"
    condition:
      target: "pyrite"
      operator: ">"
      value: 20
    action:
      priority: "HIGH"
      message: "High Pyrite with Cu. If liberation data confirms locking, flag for metallurgical review (potential regrind evaluation)."
      icon: "hammer"

  - id: "low_grade_recovery"
    description: "Low recovery requires grade-recovery optimization"
    condition:
      target: "cu_recovery"
      operator: "<"
      value: 80
    action:
      priority: "HIGH"
      message: "Low predicted Cu Recovery. Recommend review of flotation setpoints (potential FloatStar Grade-Recovery Optimiser integration)."
      icon: "activity"

  - id: "unstable_mass_pull"
    description: "High silica/gangue causes unstable mass pull"
    condition:
      target: "silica"
      operator: ">"
      value: 8
    action:
      priority: "MEDIUM"
      message: "High Silica detected. Potential for unstable mass pull. Recommend review of Rougher/Scavenger sump levels (potential FloatStar Flow Optimiser integration)."
      icon: "sliders"

  - id: "reagent_optimization_required"
    description: "Complex gangue detected requiring reagent optimization"
    condition:
      target: "pyrite"
      operator: ">"
      value: 5
    action:
      priority: "MEDIUM"
      message: "Complex sulfide matrix detected. Recommend evaluation of reagent suite (potential FloatStar Reagent Optimiser integration)."
      icon: "test-tubes"
